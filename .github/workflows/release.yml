name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag
        run: |
          python3 - <<'PY'
          import os
          import re
          from datetime import date
          from pathlib import Path

          tag = os.environ['GITHUB_REF_NAME']
          match = re.fullmatch(r'v([0-9]{4})\.([0-9]{2})\.([0-9]{2})\.(0|[1-9][0-9]*)', tag)
          if not match:
              raise SystemExit(f'Expected a tag in the format vYYYY.MM.DD.N, got {tag!r}')
          try:
              date(*(int(part) for part in match.groups()[:3]))
          except ValueError as error:
              raise SystemExit(f'Invalid date in release tag {tag!r}: {error}')
          version = Path('internal/cli/VERSION').read_text(encoding='utf-8').strip()
          if tag != f'v{version}':
              raise SystemExit(f'Release tag {tag!r} must match VERSION ({version!r})')
          PY
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Check installer and CLI
        run: |
          sh -n install.sh
          bash -n install.sh
          python3 tests/install_test.py
          go test ./...
      - name: Verify native release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          binary="$RUNNER_TEMP/sshm"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w" \
            -o "$binary" ./cmd/sshm
          test "$("$binary" version)" = "sshm $version"

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Build release binaries
        shell: bash
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w" \
              -o "dist/sshm-$os-$arch" ./cmd/sshm
          done
          cd dist
          sha256sum sshm-* > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: false
          make_latest: 'true'
