name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
      - name: Check installer and CLI
        run: |
          sh -n install.sh
          bash -n install.sh
          python3 tests/install_test.py
          go test ./...
      - name: Verify native release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          binary="$RUNNER_TEMP/sshm"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X sshm/internal/cli.Version=$version" \
            -o "$binary" ./cmd/sshm
          test "$("$binary" version)" = "sshm $version"

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
      - name: Build release binaries
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X sshm/internal/cli.Version=$version" \
              -o "dist/sshm-$os-$arch" ./cmd/sshm
          done
          cd dist
          sha256sum sshm-* > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
